<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors Sızıntı Paneli - Çıktı Ekranı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b0b0f; color: #e2e8f0; padding-bottom: 50px; }
        .navbar {
            background: linear-gradient(90deg, #13131a 0%, #1e1e2f 100%);
            padding: 20px 30px;
            border-bottom: 2px solid #ff4a4a;
            box-shadow: 0 4px 20px rgba(255, 74, 74, 0.15);
            text-align: center;
        }
        .navbar-brand { font-size: 20pt; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .navbar-brand span { color: #ff4a4a; }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        .card { background-color: #13131a; border: 1px solid #222235; border-left: 5px solid #ff4a4a; padding: 22px; margin-bottom: 25px; border-radius: 8px; }
        .card.test-card { border-left-color: #00aa55; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .asset-name { font-size: 15pt; font-weight: bold; color: #fff; }
        .asset-type { background-color: #242438; padding: 5px 12px; border-radius: 6px; font-size: 8.5pt; color: #ff4a4a; font-weight: bold; text-transform: uppercase; }
        .card.test-card .asset-type { color: #00aa55; }
        .asset-location { margin-bottom: 15px; font-size: 10pt; color: #8a8a9e; }
        .ai-analysis { background-color: #0b0b0f; padding: 18px; border-radius: 8px; border: 1px solid #1e1e2f; line-height: 1.6; color: #cbd5e1; }
        .date { font-size: 9.5pt; color: #64748b; text-align: right; margin-top: 15px; font-weight: 600; }
        .no-data { text-align: center; color: #64748b; margin-top: 40px; font-style: italic; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">👁️ DOORS <span>SIZINTI ALICISI</span></div>
    </div>

    <div class="container">
        <div id="leak-container">
            <p class="no-data">Firebase canlı verileri yükleniyor...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // GitHub sitenin dinlediği tam yetkili veritabanı konfigürasyonu
        const firebaseConfig = {
            apiKey: "AIzaSyBIK0LHEqw6gEi6fwWER4i6HK9Aoxr4ECk",
            authDomain: "emirinsta.firebaseapp.com",
            databaseURL: "https://emirinsta-default-rtdb.firebaseio.com",
            projectId: "emirinsta",
            storageBucket: "emirinsta.firebasestorage.app",
            messagingSenderId: "1054133758624",
            appId: "1:1054133758624:web:a7ec89a1e9cf350aafb7c5"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const assetRef = ref(database, 'doors_assets');

        onValue(assetRef, (snapshot) => {
            const container = document.getElementById('leak-container');
            container.innerHTML = ""; 
            
            const data = snapshot.val();
            if (!data) {
                container.innerHTML = '<p class="no-data">Henüz veri yok. Oyuna girip butonları test edin! 🎮</p>';
                return;
            }

            for (let id in data) {
                const asset = data[id];
                let displayDate = 'Tarih Belirtilmedi';
                if (asset.timestamp) {
                    const dateObj = new Date(asset.timestamp);
                    displayDate = dateObj.toLocaleDateString('tr-TR') + ' - ' + dateObj.toLocaleTimeString('tr-TR');
                }

                const isTest = id === "test_emir";
                const cardClass = isTest ? "card test-card" : "card";

                const cardHTML = `
                    <div class="${cardClass}">
                        <div class="card-header">
                            <span class="asset-name">📦 ${asset.name || 'İsimsiz Asset'}</span>
                            <span class="asset-type">${asset.type || 'Bilinmiyor'}</span>
                        </div>
                        <div class="asset-location">📂 <strong>Konum:</strong> ${asset.parent || 'Workspace'} | <strong>Kimlik:</strong> ${id}</div>
                        
                        <div class="ai-analysis">
                            <strong style="color: ${isTest ? '#00aa55' : '#4ade80'};">📊 Detay / Çıktı:</strong><br><br>
                            ${asset.ai_summary || 'Yorum yok.'}
                        </div>
                        
                        <div class="date">🕒 Alınma Zamanı: ${displayDate}</div>
                    </div>
                `;
                container.insertAdjacentHTML('afterbegin', cardHTML); 
            }
        });
    </script>
</body>
</html>
